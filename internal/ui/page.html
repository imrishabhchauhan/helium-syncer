<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helium Syncer</title>
<style>
:root {
  --bg: #F5F5F7; --surface: #FFFFFF; --surface-2: #F0F0F3; --text: #1D1D1F; --text-2: #55555C; --text-3: #6E6E76;
  --border: #E3E3E8; --control: #8A8A92; --accent: #1560EF; --on-accent: #FFFFFF; --accent-soft: rgba(21, 96, 239, .12);
  --ok: #1E7F45; --warn: #A15C00; --danger: #B42318;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04);
  --win-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 4px 10px rgba(0, 0, 0, .06), 0 18px 40px rgba(0, 0, 0, .12);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #1B1B1E; --surface: #242428; --surface-2: #2C2C31; --text: #F2F2F4; --text-2: #BDBDC4; --text-3: #9C9CA5;
  --border: #36363C; --control: #85858F; --accent: #2F6BEF; --on-accent: #FFFFFF; --accent-soft: rgba(90, 145, 255, .2);
  --ok: #52C47F; --warn: #F0B44C; --danger: #FF8A80;
  --shadow: 0 1px 2px rgba(0, 0, 0, .25);
  --win-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 4px 10px rgba(0, 0, 0, .3), 0 18px 40px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: 26px; line-height: 1.2; } h2 { font-size: 17px; } h3 { font-size: 15px; font-weight: 500; }
p { margin: 0; text-wrap: pretty; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); } .sm { font-size: 13px; }
a { color: var(--accent); }
.wrap { max-width: 900px; margin: 0 auto; padding: 18px 28px 32px; }
header { display: flex; align-items: center; justify-content: space-between; height: 40px; margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; }
.logo { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.logo svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 2.2; }
.progress { height: 3px; border-radius: 3px; background: var(--border); overflow: hidden; margin: -6px 0 26px; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Layouts: one narrow column, or text + real Helium picture side by side */
.single { max-width: 460px; }
.home { max-width: 620px; margin: 0 auto; }
.split { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 40px; align-items: start; }
.split .pic { position: sticky; top: 18px; }
.gap > * + * { margin-top: 20px; } .gap-sm > * + * { margin-top: 8px; }
.actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 28px; }
.actions .right { display: flex; gap: 10px; margin-left: auto; }

button, .btn { font: 500 14px var(--font); min-height: 38px; padding: 0 16px; border-radius: 9px; cursor: pointer; border: 1px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: inherit; background: none; transition: background-color .15s, border-color .15s, transform .1s; }
button:active:not(:disabled) { transform: scale(.97); }
.primary { background: var(--accent); color: var(--on-accent); min-width: 112px; }
.primary:hover:not(:disabled) { filter: brightness(1.08); }
.secondary { background: var(--surface); border-color: var(--border); }
.secondary:hover:not(:disabled) { border-color: var(--control); }
.quiet { color: var(--text-2); padding: 0 10px; margin-left: -10px; }
.quiet:hover { color: var(--text); background: var(--surface-2); }
.danger { color: var(--danger); background: var(--surface); border-color: var(--border); }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1:focus, h2:focus { outline: none; }
svg { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic { width: 16px; height: 16px; }

input[type=text] { width: 100%; height: 42px; border-radius: 9px; border: 1px solid var(--control); background: var(--surface); color: var(--text); padding: 0 12px; font: 15px var(--font); }
input[type=text]:focus { border-color: var(--accent); }
input[aria-invalid="true"] { border-color: var(--danger); }
input::placeholder { color: var(--text-3); }
input.code { font-family: var(--mono); letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
label.field { display: block; font-weight: 500; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.hint { font-size: 13px; color: var(--text-3); margin-top: 6px; min-height: 19px; }
.hint.bad { color: var(--danger); }
.err { border: 1px solid var(--danger); color: var(--danger); border-radius: 10px; padding: 10px 14px; margin-bottom: 18px; font-size: 14px; }

/* Real Helium pictures */
.stage { position: relative; background: var(--surface-2); border-radius: 14px; padding: 22px; overflow: hidden; }
.shot { display: block; width: 100%; height: auto; border-radius: 8px; box-shadow: var(--win-shadow); background: var(--surface); }
.shot-wrap { position: relative; }
.mark { position: absolute; border: 2px solid var(--accent); border-radius: 7px; box-shadow: 0 0 0 4px var(--accent-soft); pointer-events: none; transition: left .35s, top .35s, width .35s, height .35s; transition-timing-function: cubic-bezier(.2, .8, .2, 1); }
.pair { position: relative; aspect-ratio: 1.3; }
.pair .shot-wrap { position: absolute; width: 78%; }
.pair .one { left: 0; top: 0; } .pair .two { right: 0; bottom: 0; }
.cap { position: absolute; left: 8px; bottom: 8px; z-index: 1; font-size: 12px; font-weight: 500; color: var(--text); background: var(--surface); border: 1px solid var(--border); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.closed { position: absolute; inset: 0; border-radius: 8px; background: color-mix(in srgb, var(--surface-2) 70%, transparent); backdrop-filter: blur(5px) saturate(.5);
  display: grid; place-items: center; transition: opacity .45s ease; }
.closed span { font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); padding: 3px 10px; border-radius: 99px; }
.closed.off { opacity: 0; }

/* Steps of the example */
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { margin: 0 -12px; }
.steps .step { display: flex; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--text-2); font: inherit; min-height: 0; justify-content: flex-start; align-items: flex-start; transition: background-color .2s, color .2s; }
.steps .step .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--control); display: grid; place-items: center; font-size: 12px; font-variant-numeric: tabular-nums; flex: none; margin-top: 1px; }
.steps .step[aria-current="step"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.steps .step[aria-current="step"] .n { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Rows, options, switches */
.list > * + * { border-top: 1px solid var(--border); }
.item { display: flex; align-items: center; gap: 14px; padding: 11px 0; }
.item .grow, .grow { flex: 1; min-width: 0; }
.item p { font-size: 13px; color: var(--text-3); }
.kind { cursor: pointer; border-radius: 10px; padding: 9px 12px; margin: 0 -12px; border-top: none !important; }
.kind[aria-current="true"] { background: var(--surface); box-shadow: var(--shadow); }
.option { display: flex; align-items: flex-start; justify-content: flex-start; gap: 12px; width: 100%; text-align: left; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-weight: 400; min-height: 0; }
.option:hover { border-color: var(--control); }
.option[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.option b { display: block; font-weight: 500; }
.option .t3 { font-size: 13px; display: block; }
.option + .option { margin-top: 10px; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--control); flex: none; margin-top: 2px; display: grid; place-items: center; }
.option[aria-checked="true"] .radio { border-color: var(--accent); }
.option[aria-checked="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tag { font-size: 12px; font-weight: 500; color: var(--accent); margin-left: 6px; }
.switch { position: relative; width: 40px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 24px; background: var(--control); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; width: 18px; height: 18px; top: 3px; left: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--surface-2); color: var(--text-2); flex: none; }

.code-box { font: 500 18px var(--mono); letter-spacing: .05em; padding: 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); text-align: center; word-break: break-word; user-select: all; }
.check { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); flex: none; }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.cols h3 { font-size: 13px; color: var(--text-3); margin-bottom: 2px; }
.line { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.line b { font-weight: 500; font-variant-numeric: tabular-nums; }
.key { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 7px; border-radius: 7px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface); font-size: 14px; font-weight: 500; margin-right: 4px; }

/* Home */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; }
.panel + .panel { margin-top: 14px; }
.status { display: flex; gap: 12px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); } .dot.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; } .dot.wait { background: var(--control); } .dot.warn { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
.badge { font-size: 12px; color: var(--text-3); border: 1px solid var(--border); padding: 0 7px; border-radius: 99px; margin-left: 6px; font-weight: 400; }
.section { font-size: 12px; font-weight: 500; color: var(--text-3); margin: 22px 0 2px; }
.seg { display: inline-flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 9px; flex-wrap: wrap; }
.seg button { min-height: 30px; font-size: 13px; padding: 0 12px; color: var(--text-2); border-radius: 7px; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--control); }
.foot { margin-top: 18px; font-size: 12px; color: var(--text-3); text-align: center; }
.foot .link { color: var(--text-3); text-decoration: underline; min-height: 0; padding: 0; font-size: 12px; font-weight: 400; }
.modal { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .35); display: grid; place-items: center; padding: 16px; }
.sheet { background: var(--surface); border-radius: 14px; padding: 22px; width: 100%; max-width: 420px; box-shadow: var(--win-shadow); }
.sheet p { margin-top: 8px; }
.destroy { background: var(--danger); color: #fff; }
:root[data-theme="dark"] .destroy { background: #C9302C; }
.view { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.no-tx, .no-tx * { transition: none !important; }
::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--control) 45%, transparent); border-radius: 10px; border: 3px solid var(--bg); }
@media (max-width: 760px) {
  .wrap { padding: 14px 16px 28px; }
  .split { grid-template-columns: 1fr; gap: 24px; }
  .split .pic { position: static; order: -1; }
  h1 { font-size: 22px; } .cols { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></span>Helium Syncer</div>
    <button class="quiet" id="theme" style="margin:0;min-height:34px;width:34px;padding:0"></button>
  </header>
  <div class="progress hide" id="progress" aria-hidden="true"><i id="progress-bar"></i></div>
  <div id="error" class="err hide" role="alert"></div>
  <main id="main"></main>
  <p id="live" class="sr" aria-live="polite"></p>
</div>
<div id="ask" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="ask-title" aria-describedby="ask-body">
  <div class="sheet"><h2 id="ask-title"></h2><p id="ask-body" class="t2"></p>
    <div class="actions"><span></span><div class="right"><button class="secondary" id="ask-no">Cancel</button><button class="primary" id="ask-yes"></button></div></div></div>
</div>

<script>
"use strict";
const key = new URLSearchParams(location.hash.slice(1)).get("k") || "";
const $ = (id) => document.getElementById(id);
let state = null, view = "", step = "", flow = {}, storyTimer = null, previewing = false;

async function api(path, body) {
  let res;
  try {
    res = await fetch("/api/" + path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "X-Key": key, ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch { throw new Error("Helium Syncer is not open. Open Helium Syncer again."); }
  if (res.status === 403) throw new Error("This window is old. Open Helium Syncer again.");
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "This did not work. Try again.");
  return data;
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function showError(e) { $("error").textContent = e.message || String(e); $("error").classList.remove("hide"); }
const hideError = () => $("error").classList.add("hide");
async function guard(btn, fn) { const t = btn.innerHTML; btn.disabled = true; hideError(); try { await fn(); } catch (e) { showError(e); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = t; } } }
const say = (t) => ($("live").textContent = t);
// Our own question box: app windows (WebKit on Mac) do not show confirm().
function ask(title, body, verb, risky) {
  return new Promise((resolve) => {
    const box = $("ask"), opener = document.activeElement;
    $("ask-title").textContent = title; $("ask-body").textContent = body; $("ask-yes").textContent = verb; $("ask-yes").className = risky ? "primary destroy" : "primary";
    box.classList.remove("hide"); $("ask-no").focus();
    const done = (v) => { box.classList.add("hide"); document.removeEventListener("keydown", key); opener && opener.focus && opener.focus(); resolve(v); };
    const key = (e) => { if (e.key === "Escape") done(false); if (e.key === "Tab") { e.preventDefault(); (document.activeElement === $("ask-no") ? $("ask-yes") : $("ask-no")).focus(); } };
    document.addEventListener("keydown", key);
    $("ask-no").onclick = () => done(false); $("ask-yes").onclick = () => done(true);
    box.onclick = (e) => { if (e.target === box) done(false); };
  });
}
// App windows cannot open links: the app opens them in the browser.
const openLink = (url) => api("open", { url }).catch(showError);

const I = {
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>', back: '<path d="M15 6l-6 6 6 6"/>', laptop: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>', copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  pause: '<path d="M9 6v12M15 6v12"/>', play: '<path d="M8 5.5v13l10.5-6.5L8 5.5Z"/>', plus: '<path d="M12 5v14M5 12h14"/>',
};
const svg = (n) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* Theme: light first. The app keeps the choice. */
const dark = () => document.documentElement.dataset.theme === "dark";
function applyTheme(t) {
  const root = document.documentElement;
  root.classList.add("no-tx");
  root.dataset.theme = t === "dark" ? "dark" : "light";
  $("theme").innerHTML = svg(dark() ? "sun" : "moon");
  $("theme").setAttribute("aria-label", dark() ? "Use light mode" : "Use dark mode");
  document.querySelectorAll("img[data-shot]").forEach((img) => (img.src = shotURL(img.dataset.shot)));
  void root.offsetWidth; requestAnimationFrame(() => root.classList.remove("no-tx"));
}
applyTheme("light");
$("theme").onclick = () => { const t = dark() ? "light" : "dark"; applyTheme(t); api("settings", { theme: t }).then((s) => (state = s)).catch(() => {}); };

/* Real Helium pictures: testing/lab/capture-helium.ps1 and capture-helium-mac.sh */
const shotURL = (name) => `/img/${name}-${dark() ? "dark" : "light"}.webp`;
const shot = (name, alt = "") => `<img class="shot" data-shot="${name}" src="${shotURL(name)}" width="1300" height="770" alt="${esc(alt)}" decoding="async">`;
const GEOM = {
  win: { w: 1736, h: 1028, tabs: [0, 0, 1390, 70], bookmarks: [0, 128, 1290, 192], history: [56, 355, 1650, 872], settings: [172, 437, 1534, 1022], extensions: [452, 486, 1254, 1016], profile: [1610, 72, 1660, 124] },
  mac: { w: 1760, h: 1040, tabs: [0, 0, 1690, 68], bookmarks: [0, 126, 1390, 190], history: [54, 352, 1706, 870], settings: [198, 434, 1562, 1035], extensions: [480, 483, 1282, 806], profile: [1634, 70, 1686, 122] },
};
const pairPic = () => `<div class="pic" aria-hidden="true"><div class="stage"><div class="pair"><div class="shot-wrap one">${shot(`window-${there()}`)}</div><div class="shot-wrap two">${shot(`window-${here()}`)}</div></div></div></div>`;
const markPic = (k) => { const g = GEOM[here()]; return `<div class="pic" aria-hidden="true"><div class="stage"><div class="shot-wrap">${shot(`window-${here()}`)}<span class="mark" style="${markStyle(g, g[k])}"></span></div></div></div>`; };
const PAGE = { tabs: "window", bookmarks: "window", history: "history", settings: "settings", extensions: "extensions" };
const isMac = () => state.os === "darwin";
const here = () => (isMac() ? "mac" : "win"), there = () => (isMac() ? "win" : "mac");
const markStyle = (g, [x0, y0, x1, y1]) => `left:${(x0 / g.w) * 100}%;top:${(y0 / g.h) * 100}%;width:${((x1 - x0) / g.w) * 100}%;height:${((y1 - y0) / g.h) * 100}%`;

/* Words */
const firstName = () => (state?.personName || "").trim().split(/\s+/)[0] || "";
const thisKind = () => (isMac() ? (state.hasBattery ? "MacBook" : "Mac") : state.os === "windows" ? (state.hasBattery ? "Windows laptop" : "Windows PC") : "computer");
const otherKind = () => (isMac() ? "Windows computer" : "Mac");
function ago(ms) {
  if (!ms) return "never";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) { const m = Math.round(s / 60); return m + (m === 1 ? " minute ago" : " minutes ago"); }
  if (s < 86400) { const h = Math.round(s / 3600); return h + (h === 1 ? " hour ago" : " hours ago"); }
  return new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
const KIND = {
  bookmarks: ["Bookmarks", "Bar and folders"], history: ["History", "The last 85 days"], tabs: ["Open tabs", "With pinned tabs and tab groups"],
  settings: ["Settings", "Theme, toolbar, start page and more"], extensions: ["Extensions", "With their settings"],
};
const OPS = { bookmark: "bookmarks", visit: "history", title: "history", tab: "tabs", group: "tabs", setting: "settings", ext: "extensions", "ext-data": "extensions" };

/* Frame */
const ORDER = () => ["name", "how", "choose", flow.join ? "join" : "code", "what", "profiles", ...(state.hasBattery ? ["battery"] : []), "preview"];
function render(name, html, after) {
  clearInterval(storyTimer);
  view = name; hideError();

  const b = e.target.closest("[data-remove]"); if (!b) return;
  if (!(await ask(`Remove “${b.dataset.name}”?`, "To join again, it needs your sync code.", "Remove computer", true))) return;
  await guard(b, async () => { await api("remove-device", { id: b.dataset.remove }); await loadDevices(); });
});
function renderSettings() {
  const s = state, synced = s.profiles.filter((p) => p.synced).map((p) => p.name);
  $("settings").innerHTML = `<h2>Settings</h2>
    <p class="section">What syncs</p><div>${kindRows("s", s.off || [])}</div>
    <p class="section">This computer</p>
    <div class="list">
      <div class="item"><div class="grow"><h3>Profiles</h3><p>${esc(synced.join(", ") || "None")}</p></div><button class="secondary" id="s-prof">Change</button></div>
      ${s.hasBattery ? `<div class="item" style="flex-wrap:wrap"><div class="grow"><h3>Battery</h3></div><div class="seg" role="radiogroup" aria-label="Battery">${BATTERY.map((b) => `<button role="radio" data-sbat="${b.id}" aria-checked="${s.battery === b.id}">${b.title}</button>`).join("")}</div></div>` : ""}
      <div class="item"><div class="grow"><h3>Start Helium Syncer at login</h3></div><label class="switch"><input type="checkbox" id="s-auto" aria-label="Start Helium Syncer at login" ${s.autostart ? "checked" : ""}><span></span></label></div>
      <div class="item"><div class="grow"><h3>Open synced tabs when Helium starts</h3></div><label class="switch"><input type="checkbox" id="s-restore" aria-label="Open synced tabs when Helium starts" ${s.restoreTabs ? "checked" : ""}><span></span></label></div>
      <div class="item"><div class="grow"><label class="field" for="s-person">Your name</label><input type="text" id="s-person" maxlength="40" placeholder="Enter your name" value="${esc(s.personName)}"></div></div>
      <div class="item"><div class="grow"><label class="field" for="s-dev">Computer name</label><input type="text" id="s-dev" maxlength="60" value="${esc(s.deviceName)}"></div></div>
    </div>
    <p class="section">Sync</p>
    <div class="list">
      <div class="item"><div class="grow"><h3>Sync code</h3><p id="s-code">Hidden</p></div><button class="secondary" id="s-copy">${svg("copy")}Copy</button><button class="secondary" id="s-show">Show</button></div>
      <div class="item"><div class="grow"><h3>How it works</h3></div><button class="secondary" id="s-how">Open</button></div>
      <div class="item"><div class="grow"><h3>Leave this sync</h3><p>Helium stays as it is.</p></div><button class="danger" id="s-leave">Leave</button></div>
    </div>`;
  wireKinds("s", (off) => api("settings", { off }).then((st) => { state = st; say("Saved."); }).catch(showError));
  $("s-prof").onclick = () => go("profiles");
  document.querySelectorAll("[data-sbat]").forEach((b) => (b.onclick = () => api("settings", { battery: b.dataset.sbat }).then((st) => {
    state = st; document.querySelectorAll("[data-sbat]").forEach((x) => x.setAttribute("aria-checked", String(x === b))); say("Saved.");
  }).catch(showError)));
  $("s-auto").onchange = (e) => api("settings", { autostart: e.target.checked }).then(() => say("Saved.")).catch(showError);
  $("s-restore").onchange = (e) => api("settings", { restoreTabs: e.target.checked }).then(() => say("Saved.")).catch(showError);
  const saveText = (id, field, k) => $(id).addEventListener("change", (e) => {
    const v = e.target.value.trim(); if (!v) { e.target.value = state[k]; return; }
    api("settings", { [field]: v }).then((st) => { state = st; say("Saved."); }).catch(showError);
  });
  saveText("s-person", "personName", "personName"); saveText("s-dev", "name", "deviceName");
  $("s-copy").onclick = (e) => guard(e.currentTarget, async () => { await api("copy-code", {}); e.currentTarget.innerHTML = svg("check") + "Copied"; say("Copied."); });
  $("s-show").onclick = async (e) => {
    const el = $("s-code");
    if (el.dataset.shown) { el.textContent = "Hidden"; el.style.fontFamily = ""; delete el.dataset.shown; e.target.textContent = "Show"; return; }
    try { el.textContent = (await api("code")).code; el.style.fontFamily = "var(--mono)"; el.dataset.shown = "1"; e.target.textContent = "Hide"; } catch (err) { showError(err); }
  };
  $("s-how").onclick = () => { flow.fromHome = true; go("how"); };
  $("s-leave").onclick = async (e) => {
    const b = e.currentTarget;
    if (!(await ask("Leave this sync?", "Helium stays as it is. Your other computers continue to sync. To join again, you need your sync code.", "Leave sync", true))) return;
    guard(b, async () => { state = await api("disconnect", {}); flow = {}; go("choose"); });
  };
}

/* Router */
function route() {
  const s = state;
  if (!s.heliumFound && !s.setupDone) { if (view !== "missing") vMissing(); return; }
  const want = (() => {
    if (step === "how") return "how";
    if (!s.setupDone && (!s.personName || step === "name")) return "name";
    if (!s.connected) return step === "join" ? "join" : step === "choose" ? "choose" : "how";
    if (s.freshCode) return "code";
    if (["done", "profiles", "code"].includes(step)) return step;
    if (!s.setupDone) return ["what", "battery", "preview"].includes(step) ? step : "what";
    return "home";
  })();
  if (view === want) { if (want === "home") renderHome(); else if (want === "preview") runPreview(false); return; }
  step = want;
  ({ name: vName, how: vHow, choose: vChoose, join: vJoin, code: vCode, what: vWhat, profiles: vProfiles, battery: vBattery, preview: vPreview, done: vDone, home: vHome })[want]();
}
async function refresh() {
  try {
    const first = !state;
    state = await api("state");
    if (first) applyTheme(state.theme);
    route();
  } catch (e) { showError(e); }
}
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
