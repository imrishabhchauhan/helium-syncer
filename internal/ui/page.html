<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Helium Syncer</title>
<style>
:root {
  --bg: #F7F7F8; --surface: #FFFFFF; --surface-2: #F2F2F4; --text: #18181B; --text-2: #52525B; --text-3: #6B6B74;
  --border: #E4E4E7; --control: #8A8A93; --accent: #1560EF; --on-accent: #FFFFFF; --accent-soft: rgba(21, 96, 239, .1);
  --ok: #1E7F45; --warn: #A15C00; --danger: #B42318;
  --shadow: 0 1px 2px rgba(24, 24, 27, .05);
  --win-shadow: 0 0 0 1px rgba(24, 24, 27, .06), 0 2px 4px rgba(24, 24, 27, .06), 0 16px 40px rgba(24, 24, 27, .14);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0F0F11; --surface: #18181B; --surface-2: #1F1F23; --text: #F4F4F5; --text-2: #B4B4BC; --text-3: #9A9AA3;
  --border: #2B2B31; --control: #7C7C86; --accent: #2E6BEF; --on-accent: #FFFFFF; --accent-soft: rgba(80, 140, 255, .16);
  --ok: #4CC27B; --warn: #F0B44C; --danger: #FF8A80;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  --win-shadow: 0 0 0 1px rgba(255, 255, 255, .07), 0 2px 4px rgba(0, 0, 0, .3), 0 16px 40px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: 24px; line-height: 1.25; } h2 { font-size: 17px; line-height: 1.35; } h3 { font-size: 15px; line-height: 1.4; }
p { margin: 0; text-wrap: pretty; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); } .sm { font-size: 13px; }
a { color: var(--accent); text-underline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 56px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; flex: none; }
.logo svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 2.2; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
.pad { padding: 24px; }
.stack > * + * { margin-top: 10px; } .gap > * + * { margin-top: 22px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.end { justify-content: flex-end; } .between { justify-content: space-between; }
button, .btn { font: 500 14px var(--font); min-height: 40px; padding: 0 16px; border-radius: 9px; cursor: pointer; border: 1px solid transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; color: inherit; background: none;
  transition: background-color .15s, border-color .15s, transform .1s; }
button:active:not(:disabled), .btn:active { transform: scale(.97); }
.primary { background: var(--accent); color: var(--on-accent); }
.primary:hover:not(:disabled) { filter: brightness(1.08); }
.secondary { background: var(--surface); border-color: var(--border); }
.secondary:hover:not(:disabled) { border-color: var(--control); }
.quiet { color: var(--text-2); padding: 0 8px; }
.quiet:hover { color: var(--text); }
.danger { color: var(--danger); border-color: var(--border); background: var(--surface); }
.danger:hover { border-color: var(--danger); }
button:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1:focus, h2:focus { outline: none; }
svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic { width: 18px; height: 18px; color: var(--text-3); }
input[type=text] { width: 100%; height: 44px; border-radius: 9px; border: 1px solid var(--control); background: var(--surface); color: var(--text); padding: 0 13px; font: 15px var(--font); }
input[type=text]:focus { border-color: var(--accent); }
input[aria-invalid="true"] { border-color: var(--danger); }
input::placeholder { color: var(--text-3); }
input.code { font-family: var(--mono); letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
label.field { display: block; font-weight: 500; font-size: 14px; margin-bottom: 7px; }
.hint { font-size: 13px; color: var(--text-3); margin-top: 7px; min-height: 1px; }
.err { border: 1px solid var(--danger); color: var(--danger); background: var(--surface); border-radius: 10px; padding: 11px 14px; margin-bottom: 16px; font-size: 14px; }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.divide > * + * { border-top: 1px solid var(--border); }

/* Progress */
.progress { display: flex; align-items: center; gap: 14px; margin: -8px 0 18px; }
.progress .bar { flex: 1; height: 3px; border-radius: 3px; background: var(--border); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.progress span { font-size: 12px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Real Helium windows */
.stage { position: relative; background: var(--surface-2); border-radius: 12px; overflow: hidden; }
.shot { display: block; width: 100%; height: auto; border-radius: 9px; box-shadow: var(--win-shadow); background: var(--surface); }
.shot-wrap { position: relative; }
.hero { height: 250px; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.hero .shot-wrap { position: absolute; width: 74%; }
.hero .back { left: 5%; top: 26px; }
.hero .front { right: 5%; top: 66px; }
.mark { position: absolute; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 4px var(--accent-soft); pointer-events: none; transition: all .35s cubic-bezier(.2, .8, .2, 1); }

/* The how-it-works story */
.story { display: grid; grid-template-columns: 1fr 44px 1fr; align-items: center; padding: 26px 18px 16px; }
.story figure { margin: 0; }
.story figcaption { text-align: center; font-size: 12px; color: var(--text-3); margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.story figcaption svg { width: 14px; height: 14px; }
.closed { position: absolute; inset: 0; border-radius: 9px; background: color-mix(in srgb, var(--surface-2) 72%, transparent); backdrop-filter: blur(6px) saturate(.6);
  display: grid; place-items: center; transition: opacity .5s ease; }
.closed span { font-size: 12px; font-weight: 500; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); padding: 4px 10px; border-radius: 99px; box-shadow: var(--shadow); }
.closed.off { opacity: 0; }
.link-line { position: relative; height: 100%; }
.link-line::before { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; border-top: 1px dashed var(--control); }
.token { position: absolute; top: 50%; left: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; opacity: 0; }
.token svg { width: 13px; height: 13px; stroke-width: 2.2; }
.story[data-s="2"] .token { animation: carry 2.2s cubic-bezier(.45, 0, .2, 1) .4s infinite; }
@keyframes carry { 0% { opacity: 0; transform: translateX(-60px); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(60px); } }
.caption { display: flex; gap: 12px; align-items: baseline; min-height: 52px; }
.caption .n { font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; flex: none; }
.caption p { font-size: 16px; }
.fade { animation: fade .4s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.steps-nav { display: flex; gap: 4px; }
.steps-nav button { min-height: 32px; min-width: 32px; padding: 0 10px; font-size: 13px; color: var(--text-3); border-radius: 8px; }
.steps-nav button[aria-current="true"] { color: var(--text); background: var(--surface-2); }

/* Lists and rows */
.item { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
.item:first-child { padding-top: 0; } .item:last-child { padding-bottom: 0; }
.grow { flex: 1; min-width: 0; }
.item p { font-size: 13px; color: var(--text-2); }
.fact { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--text-2); }
.fact b { color: var(--text); font-weight: 500; }
.option { display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); min-height: 0; font-weight: 400; }
.option:hover { border-color: var(--control); }
.option[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.option b { display: block; font-weight: 500; font-size: 15px; }
.option .t2 { font-size: 13px; display: block; }
.option + .option { margin-top: 10px; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--control); flex: none; margin-top: 2px; display: grid; place-items: center; }
.option[aria-checked="true"] .radio { border-color: var(--accent); }
.option[aria-checked="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tag { font-size: 12px; font-weight: 500; color: var(--accent); margin-left: 8px; }
.kind { cursor: pointer; border-radius: 10px; padding: 12px !important; margin: 0 -12px; }
.kind[aria-current="true"] { background: var(--surface-2); }

/* Switch */
.switch { position: relative; width: 40px; height: 24px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 24px; background: var(--control); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; width: 18px; height: 18px; top: 3px; left: 3px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Code, checks, notes */
.code-box { font: 500 19px var(--mono); letter-spacing: .05em; padding: 18px; border-radius: 10px; background: var(--surface-2); text-align: center; word-break: break-word; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.note { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--text-2); }
.note b { color: var(--text); font-weight: 500; }
.timeline { display: flex; gap: 3px; align-items: center; margin: 12px 0 4px; }
.timeline i { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
.timeline i.on { background: var(--accent); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); flex: none; }

/* Preview table */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 28px; }
.cols h3 { font-size: 13px; font-weight: 500; color: var(--text-3); margin-bottom: 4px; }
.line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.line b { font-weight: 500; font-variant-numeric: tabular-nums; }
.keys { display: inline-flex; gap: 6px; flex: none; }
.key { display: inline-grid; place-items: center; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface); font-size: 15px; font-weight: 500; }

/* Home */
.status { display: flex; gap: 12px; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--ok); } .dot.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; } .dot.wait { background: var(--control); } .dot.warn { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
.stats { display: flex; gap: 32px; flex-wrap: wrap; }
.stats div { font-size: 13px; color: var(--text-3); }
.stats b { display: block; font-size: 20px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.badge { font-size: 12px; color: var(--text-3); border: 1px solid var(--border); padding: 1px 7px; border-radius: 99px; margin-left: 8px; font-weight: 400; vertical-align: 1px; }
.section { font-size: 12px; font-weight: 500; color: var(--text-3); margin: 28px 0 8px; }
.seg { display: inline-flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 9px; border: 1px solid var(--border); flex-wrap: wrap; }
.seg button { min-height: 32px; font-size: 13px; padding: 0 12px; color: var(--text-2); border-radius: 7px; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); border-color: var(--control); }
footer { margin-top: 30px; text-align: center; font-size: 12px; color: var(--text-3); }
footer a { color: var(--text-3); }
.view { animation: fade .3s ease; }
.no-tx, .no-tx * { transition: none !important; }
@media (max-width: 560px) {
  .pad { padding: 18px; } h1 { font-size: 21px; }
  .hero { height: 190px; } .story { grid-template-columns: 1fr 26px 1fr; padding: 18px 10px 12px; }
  .row.end > button { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-13.7 5.6M4 12a8 8 0 0 1 13.7-5.6"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></span>Helium Syncer</div>
    <button class="quiet" id="theme" style="min-height:36px;width:36px;padding:0"></button>
  </header>
  <div id="error" class="err hide" role="alert"></div>
  <div id="progress" class="progress hide" aria-hidden="true"><div class="bar"><i id="progress-bar"></i></div><span id="progress-text"></span></div>
  <main id="main"></main>
  <p id="live" class="sr" aria-live="polite"></p>
  <footer>Helium Syncer <span id="ver"></span> · Free and open source · Not related to the Helium browser team · <a href="https://github.com/imrishabhchauhan/helium-syncer" target="_blank" rel="noopener">GitHub</a></footer>
</div>

<script>
"use strict";
const key = new URLSearchParams(location.hash.slice(1)).get("k") || "";
const $ = (id) => document.getElementById(id);
let state = null, view = "", step = "", flow = {}, storyTimer = null, previewing = false;

async function api(path, body) {
  let res;
  try {
    res = await fetch("/api/" + path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "X-Key": key, ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch {
    throw new Error("Helium Syncer is not open. Open Helium Syncer. Then reload this page.");
  }
  if (res.status === 403) throw new Error("This page link is old. Open Helium Syncer again. It opens a new page.");
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "This did not work. Try again. If it does not work again, close and open Helium Syncer.");
  return data;
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function showError(e) { $("error").textContent = e.message || String(e); $("error").classList.remove("hide"); $("error").scrollIntoView({ block: "nearest" }); }
function hideError() { $("error").classList.add("hide"); }
async function guard(btn, fn) { const t = btn.innerHTML; btn.disabled = true; hideError(); try { await fn(); } catch (e) { showError(e); } finally { if (btn.isConnected) { btn.disabled = false; btn.innerHTML = t; } } }
const say = (t) => ($("live").textContent = t);

/* Icons: one line style, one neutral colour. */
const I = {
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>', lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/>',
  shield: '<path d="M12 3 5 6v5.5c0 4.3 3 8 7 9.5 4-1.5 7-5.2 7-9.5V6l-7-3Z"/>', pause: '<path d="M9 6v12M15 6v12"/>', play: '<path d="M8 5.5v13l10.5-6.5L8 5.5Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>', laptop: '<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2M14 9l1.5 1.5"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  back: '<path d="M15 6l-6 6 6 6"/>', power: '<path d="M12 3v8M7 6a7 7 0 1 0 10 0"/>',
};
const svg = (n, cls = "ic") => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* Theme: follows the computer; the button changes it for this computer. */
const media = matchMedia("(prefers-color-scheme: dark)");
let theme = null; try { theme = localStorage.getItem("hs-theme"); } catch {}
const dark = () => document.documentElement.dataset.theme === "dark";
function applyTheme() {
  document.documentElement.dataset.theme = theme || (media.matches ? "dark" : "light");
  $("theme").innerHTML = svg(dark() ? "sun" : "moon");
  $("theme").setAttribute("aria-label", dark() ? "Use light mode" : "Use dark mode");
  document.querySelectorAll("img[data-shot]").forEach((img) => (img.src = shotURL(img.dataset.shot)));
}
media.addEventListener("change", applyTheme);
$("theme").onclick = () => {
  const root = document.documentElement;
  theme = dark() ? "light" : "dark";
  root.classList.add("no-tx"); applyTheme(); void root.offsetWidth;
  requestAnimationFrame(() => root.classList.remove("no-tx"));
  try { localStorage.setItem("hs-theme", theme); } catch {}
};

/* Real Helium pictures (captured from Helium: testing/lab/capture-helium.ps1). */
const shotURL = (name) => `/img/${name}-${dark() ? "dark" : "light"}.webp`;
const shot = (name, alt) => `<img class="shot" data-shot="${name}" src="${shotURL(name)}" width="1300" height="770" alt="${esc(alt)}" decoding="async">`;
// Where each item is in the picture, in pixels of the 1736 × 1028 capture.
const AREA = {
  tabs: ["window", [0, 0, 1390, 70]], bookmarks: ["window", [0, 128, 1290, 192]], history: ["history", [56, 355, 1650, 872]],
  settings: ["settings", [172, 437, 1534, 1022]], extensions: ["extensions", [452, 486, 1254, 808]],
};
const markStyle = ([x0, y0, x1, y1]) => `left:${x0 / 17.36}%;top:${y0 / 10.28}%;width:${(x1 - x0) / 17.36}%;height:${(y1 - y0) / 10.28}%`;

/* Words */
const firstName = () => (state?.personName || "").trim().split(/\s+/)[0] || "";
const thisKind = () => state.os === "darwin" ? (state.hasBattery ? "MacBook" : "Mac") : state.os === "windows" ? (state.hasBattery ? "Windows laptop" : "Windows PC") : "computer";
const otherKind = () => state.os === "darwin" ? "Windows computer" : "Mac";
function ago(ms) {
  if (!ms) return "never";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) { const m = Math.round(s / 60); return m + (m === 1 ? " minute ago" : " minutes ago"); }
  if (s < 86400) { const h = Math.round(s / 3600); return h + (h === 1 ? " hour ago" : " hours ago"); }
  return new Date(ms).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
const KIND = {
  bookmarks: { title: "Bookmarks", desc: "The bookmarks bar and all bookmark folders." },
  history: { title: "History", desc: "Pages that you opened in the last 85 days." },
  tabs: { title: "Open tabs", desc: "Open tabs, pinned tabs and tab groups." },
  settings: { title: "Settings", desc: "Start page, toolbar, theme, fonts, languages and privacy." },
  extensions: { title: "Extensions", desc: "Extensions and their settings." },
};
const OPS = { bookmark: "bookmarks", visit: "history", title: "history", tab: "tabs", group: "tabs", setting: "settings", ext: "extensions", "ext-data": "extensions" };

/* Progress */
const STEPS = () => (flow.join ? ["how", "choose", "join", "what", "profiles", "battery", "preview"] : ["how", "choose", "code", "what", "profiles", "battery", "preview"]).filter((s) => s !== "battery" || state.hasBattery);
function progress(name) {
  const list = STEPS(), i = state.setupDone ? -1 : list.indexOf(name);
  $("progress").classList.toggle("hide", i < 0);
  if (i >= 0) { $("progress-bar").style.width = ((i + 1) / list.length) * 100 + "%"; $("progress-text").textContent = `Step ${i + 1} of ${list.length}`; }
}
function render(name, html, after) {

  render("done", `<div class="panel pad gap">
    <div class="stack"><h1><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;color:var(--ok);vertical-align:-3px;margin-right:6px">${I.check}</svg>All done${name ? ", " + esc(name) : ""}</h1><p class="t2">Helium Syncer is on. It syncs when you close Helium.</p></div>
    <div class="note">${svg("laptop")}<p><b>Next:</b> install Helium Syncer on your other computer. Select “No, I use it on a different computer”. Then type your sync code.</p></div>
    <div class="row end"><button class="primary" id="done-go">Open Helium Syncer</button></div>
  </div>`, () => { $("done-go").onclick = () => { step = ""; route(); }; });
}

/* Home */
function statusOf(s) {
  if (s.syncing) return ["busy", "Syncing", "Keep Helium closed for a moment."];
  if (s.paused) return ["warn", "Sync is paused", s.paused];
  if (s.lastError) return ["warn", "Sync needs your attention", s.lastError];
  if (s.powerNote) return ["wait", "Waits for power", s.powerNote];
  if (s.heliumOpen) return ["wait", "Helium is open", "Your changes sync when you close Helium."];
  if (!s.lastSync) return ["ok", "Ready", "Nothing synced yet."];
  return ["ok", "Up to date", "Last sync: " + ago(s.lastSync)];
}
function vHome() {
  const name = firstName();
  render("home", `<div class="gap">
    ${name ? `<p class="t2" style="margin-bottom:-10px">Hi, ${esc(name)}</p>` : ""}
    <div class="panel pad gap">
      <div class="status"><span class="dot" id="st-dot"></span><div class="grow"><h2 id="st-title"></h2><p class="t2 sm" id="st-sub"></p></div></div>
      <div class="stats" id="st-stats"></div>
      <div class="row"><button class="primary" id="sync-now">Sync now</button><button class="secondary" id="open-helium">Open Helium</button></div>
    </div>
    <div class="panel pad"><h2 style="margin-bottom:14px">Your computers</h2><div class="divide" id="devices"><p class="t3 sm">Loading…</p></div></div>
    <div class="panel pad" id="settings-card"></div>
  </div>`, () => {
    $("sync-now").onclick = (e) => guard(e.currentTarget, async () => { await api("sync", {}); say("Sync started."); await refresh(); });
    $("open-helium").onclick = (e) => guard(e.currentTarget, () => api("open-helium", {}));
    renderSettings(); renderHome(); loadDevices();
  });
}
function renderHome() {
  const s = state, [kind, title, sub] = statusOf(s), r = s.lastReport;
  $("st-dot").className = "dot " + kind; $("st-title").textContent = title; $("st-sub").textContent = sub;
  $("st-stats").innerHTML = [["Profiles syncing", s.profiles.filter((p) => p.synced).length], ["Sent last time", r ? r.Sent : 0], ["Got last time", r ? r.Received : 0]]
    .map(([l, v]) => `<div><b>${Number(v).toLocaleString()}</b>${l}</div>`).join("");
  $("sync-now").disabled = s.heliumOpen || s.syncing;
  $("sync-now").title = s.heliumOpen ? "Close Helium first" : "";
  const a = $("s-auto"); if (a && document.activeElement !== a) a.checked = s.autostart;
}
async function loadDevices() {
  try {
    const d = await api("devices");
    $("devices").innerHTML = d.devices.map((x) => `<div class="item">${svg("laptop")}<div class="grow"><h3>${esc(x.name)}${x.id === d.me ? '<span class="badge">This computer</span>' : ""}</h3><p>${x.platform === "macos" ? "Mac" : x.platform === "windows" ? "Windows" : esc(x.platform)} · Helium ${esc(x.helium_version || "not known yet")} · seen ${ago(x.last_seen)}</p></div>${x.id === d.me ? "" : `<button class="secondary" data-remove="${esc(x.id)}" data-name="${esc(x.name)}">Remove</button>`}</div>`).join("");
    if (d.devices.length < 2) $("devices").insertAdjacentHTML("beforeend", `<div class="item">${svg("plus")}<p class="grow">To add a computer, install Helium Syncer on it. Then type your sync code.</p></div>`);
  } catch (e) {
    $("devices").innerHTML = `<div class="item"><p class="grow">${esc(e.message)}</p><button class="secondary" id="dev-retry">Try again</button></div>`;
    $("dev-retry").onclick = loadDevices;
  }
}
$("main").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-remove]"); if (!b) return;
  if (!confirm(`Remove “${b.dataset.name}” from your sync? To join again, it needs your sync code.`)) return;
  await guard(b, async () => { await api("remove-device", { id: b.dataset.remove }); await loadDevices(); });
});
function renderSettings() {
  const s = state, synced = s.profiles.filter((p) => p.synced).map((p) => p.name);
  $("settings-card").innerHTML = `<h2>Settings</h2>
    <p class="section">What syncs</p><div>${kindsHTML("s", s.off || [])}</div>
    <p class="section">This computer</p>
    <div class="divide">
      <div class="item"><div class="grow"><h3>Profiles</h3><p>${esc(synced.join(", ") || "None")}</p></div><button class="secondary" id="s-prof">Change</button></div>
      ${s.hasBattery ? `<div class="item" style="flex-wrap:wrap"><div class="grow" style="min-width:200px"><h3>Battery</h3><p id="s-bat-desc">${BATTERY.find((b) => b.id === s.battery).desc}</p></div><div class="seg" role="radiogroup" aria-label="Battery">${BATTERY.map((b) => `<button role="radio" data-sbat="${b.id}" aria-checked="${s.battery === b.id}">${b.title}</button>`).join("")}</div></div>` : ""}
      <div class="item"><div class="grow"><h3>Start Helium Syncer when I log in</h3><p>It syncs after you close Helium, and while Helium is closed.</p></div><label class="switch"><input type="checkbox" id="s-auto" aria-label="Start Helium Syncer when I log in" ${s.autostart ? "checked" : ""}><span></span></label></div>
      <div class="item"><div class="grow"><h3>Open synced tabs when Helium starts</h3><p>This sets Helium to “Continue where you left off”.</p></div><label class="switch"><input type="checkbox" id="s-restore" aria-label="Open synced tabs when Helium starts" ${s.restoreTabs ? "checked" : ""}><span></span></label></div>
      <div class="item"><div class="grow"><label class="field" for="s-person">Your name</label><input type="text" id="s-person" maxlength="40" placeholder="Enter your name" value="${esc(s.personName)}"></div></div>
      <div class="item"><div class="grow"><label class="field" for="s-dev">Name of this computer</label><input type="text" id="s-dev" maxlength="60" value="${esc(s.deviceName)}"><p class="hint">Your other computers show this name.</p></div></div>
    </div>
    <p class="section">Sync code and help</p>
    <div class="divide">
      <div class="item"><div class="grow"><h3>Sync code</h3><p id="s-code">Hidden. Use it to add a computer.</p></div><button class="secondary" id="s-show">Show</button></div>
      <div class="item"><div class="grow"><h3>How Helium Syncer works</h3><p>See the example again.</p></div><button class="secondary" id="s-how">Show</button></div>
      <div class="item"><div class="grow"><h3>Leave this sync</h3><p>Your Helium data stays on this computer.</p></div><button class="danger" id="s-leave">Leave</button></div>
    </div>`;
  wireKinds("s", (off) => api("settings", { off }).then((st) => { state = st; say("Saved."); }).catch(showError));
  $("s-prof").onclick = () => { step = "profiles"; route(); };
  document.querySelectorAll("[data-sbat]").forEach((b) => (b.onclick = () => api("settings", { battery: b.dataset.sbat }).then((st) => {
    state = st; document.querySelectorAll("[data-sbat]").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
    $("s-bat-desc").textContent = BATTERY.find((x) => x.id === b.dataset.sbat).desc; say("Saved.");
  }).catch(showError)));
  $("s-auto").onchange = (e) => api("settings", { autostart: e.target.checked }).then(() => say("Saved.")).catch(showError);
  $("s-restore").onchange = (e) => api("settings", { restoreTabs: e.target.checked }).then(() => say("Saved.")).catch(showError);
  const saveText = (id, field, stateKey) => $(id).addEventListener("change", (e) => {
    const v = e.target.value.trim();
    if (!v) { e.target.value = state[stateKey]; return; }
    api("settings", { [field]: v }).then((st) => { state = st; say("Saved."); }).catch(showError);
  });
  saveText("s-person", "personName", "personName"); saveText("s-dev", "name", "deviceName");
  $("s-show").onclick = async (e) => {
    const el = $("s-code");
    if (el.dataset.shown) { el.textContent = "Hidden. Use it to add a computer."; el.style.fontFamily = ""; delete el.dataset.shown; e.target.textContent = "Show"; return; }
    try { const c = await api("code"); el.textContent = c.code; el.style.fontFamily = "var(--mono)"; el.dataset.shown = "1"; e.target.textContent = "Hide"; } catch (err) { showError(err); }
  };
  $("s-how").onclick = () => { flow.fromHome = true; step = "how"; route(); };
  $("s-leave").onclick = (e) => {
    if (!confirm("Leave this sync on this computer?\n\nYour Helium data stays on this computer. Your other computers continue to sync. To join again, you need your sync code.")) return;
    guard(e.currentTarget, async () => { state = await api("disconnect", {}); step = "choose"; flow = {}; route(); });
  };
}

/* Router */
function route() {
  const s = state;
  if (!s.heliumFound && !s.setupDone) { if (view !== "missing") vMissing(); return; }
  if (step === "how") { if (view !== "how") vHow(); return; }
  if ((!s.personName && !s.setupDone) || step === "hello") { if (view !== "hello") vHello(); return; }
  if (!s.connected) {
    if (step === "join") { if (view !== "join") vJoin(); return; }
    if (step === "choose") { if (view !== "choose") vChoose(); return; }
    if (view !== "how" && view !== "choose") { step = "how"; vHow(); }
    return;
  }
  if (s.freshCode) { if (view !== "code") vCode(); return; }
  if (step === "done") { if (view !== "done") vDone(); return; }
  if (step === "profiles") { if (view !== "profiles") vProfiles(); return; }
  if (!s.setupDone) {
    if (!["what", "profiles", "battery", "preview"].includes(step)) step = "what";
    const v = { what: vWhat, battery: vBattery, preview: vPreview }[step];
    if (view !== step) v(); else if (step === "preview") runPreview(false);
    return;
  }
  if (view !== "home") vHome(); else renderHome();
}
async function refresh() {
  try { state = await api("state"); $("ver").textContent = state.appVersion; route(); }
  catch (e) { showError(e); }
}
applyTheme();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
